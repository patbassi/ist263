<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width", initial-scale=1;>
        <title>Flex Intro</title>
            <style>
        div {border: 1px solid green;}
        section {display: flex;} /* this property must go on the row */
        section div {flex: 1;} /* must be on the columns */
    </style>
    </head>
    <body>
        <section>
<div>1</div>
<div>2</div>
<div>3</div>
</section>
    </body>
</html>
