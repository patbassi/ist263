<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width", initial-scale=1;>
        <title>Flex Intro</title>
            <style>
        div {border: 1px solid green;}
        section {display: flex;} /* this property must go on the row */
        section div {flex: 1;} /* must be on the columns */
        .b {flex: 1;}
        .t {flex: 3;}
    </style>
    </head>
    <body>
        <section class="a">
<div>1</div>
</section>

<section>
    <div class="b">2</div>
    <div class="t">3</div>
</section>

<section class="c">
    <div>4</div>
    <div>5</div>
</section>
    </body>
</html>
