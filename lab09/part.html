<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {font-family: Arial, Helvetica, sans-serif;}
        section div {
            background: #f8f8f8;
            margin: 10px;
            padding: 20px;
            color: #000E54;
            flex: 1;
        }
        section {display: flex; flex-wrap: wrap; /* this property must be on flexbox row*/}


        @media only screen and (max-width: 800px) {
            body {background-color: orange;} 
            .over{display: none;}
        }
          @media only screen and (min-width: 801px) {
            body {background-color: orange;} 
            .under{display: none;}
        }
    </style>
</head>
<body>
    <p class="under">Im small</p>
    <p class="over">Im big</p>

</section>






</body>
</html>
